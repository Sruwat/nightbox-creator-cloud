<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Opening NightBox : video player...</title>
  <meta name="description" content="Watch high-quality videos on the NightBox : video player app.">
  <meta name="theme-color" content="#000000">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050505;
      --surface: rgba(255, 255, 255, 0.05);
      --accent: #8B5CF6;
      --accent-glow: rgba(139, 92, 246, 0.5);
      --text: #FFFFFF;
      --text-dim: #94A3B8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-color);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient Background Glow */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: var(--accent);
      filter: blur(120px);
      opacity: 0.15;
      z-index: -1;
      animation: pulse 4s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.1; transform: translate(-50%, -50%) scale(1); }
      to { opacity: 0.2; transform: translate(-50%, -50%) scale(1.2); }
    }

    /* Glass Container */
    .container {
      width: 90%;
      max-width: 400px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 40px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .app-logo {
      width: 80px;
      height: 80px;
      background: #FFFFFF;
      border-radius: 20px;
      margin: 0 auto 24px;
      padding: 10px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .app-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Modern Loader */
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      margin: 0 auto 32px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* High-End Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 12px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: #7C3AED;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-secondary:active {
      background: rgba(255,255,255,0.1);
    }

    .footer {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 24px;
      opacity: 0.6;
    }

    #browserPlayer { display: none; width: 100%; border-radius: 18px; margin: 0 0 20px; background: #000; }

  </style>
</head>
<body>
  <div class="glow"></div>
  
  <div class="container">
    <div class="app-logo">
      <img src="/logo.png" alt="App Logo">
    </div>
    
    <h1>Opening in NightBox</h1>
    <p id="status">Attempting to open the video in your app. Please wait a moment...</p>
    <video id="browserPlayer" controls crossorigin="anonymous" playsinline preload="metadata"></video>
    
    <div class="loader" id="loader"></div>

    <a href="#" class="btn btn-primary" id="openBtn">Open App Manually</a>
    <a href="https://play.google.com/store/apps/details?id=simple.shayaribygenz" class="btn btn-secondary">Get it on Play Store</a>

    <div class="footer">
      NightBox : video player &copy; 2026
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" crossorigin="anonymous"></script>
  <script>
    const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=simple.shayaribygenz";
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    let videoId = pathParts[0] === 'watch' ? pathParts[1] : null;
    const pathSlug = pathParts[0] === 'l' ? pathParts[1] : null;
    const linkSlug = new URLSearchParams(window.location.search).get('link') || pathSlug;
    const browserPlayer = document.getElementById('browserPlayer');
    let viewSessionId = null;
    let viewToken = null;
    let qualified = false;
    let qualificationInFlight = false;
    let minimumWatchSeconds = 5;

    async function resolveVideoId() {
      if (videoId) return videoId;
      if (!linkSlug) throw new Error('Missing NightBox link');
      const response = await fetch(`/api/links/${encodeURIComponent(linkSlug)}`);
      if (!response.ok) throw new Error('Share link not found');
      const payload = await response.json();
      videoId = payload?.link?.videoId || null;
      if (!videoId) throw new Error('Video ID missing');
      return videoId;
    }

    function buildIntentUrl() {
      // Keep the share slug when possible. The app can resolve /l/:slug
      // itself, which avoids waiting for the browser to resolve metadata first.
      const intentHost = window.location.host;
      const targetPath = linkSlug ? `/l/${encodeURIComponent(linkSlug)}` : `/watch/${encodeURIComponent(videoId || '')}`;
      return `intent://${intentHost}${targetPath}#Intent;scheme=https;package=simple.shayaribygenz;S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end`;
    }

    function buildAppSchemeUrl() {
      const targetPath = linkSlug ? `/l/${encodeURIComponent(linkSlug)}` : `/watch/${encodeURIComponent(videoId || '')}`;
      return `nightbox://${targetPath.replace(/^\//, '')}`;
    }

    async function startBrowserView() {
      if (!linkSlug || /android/i.test(navigator.userAgent)) return;
      try {
        const resolvedVideoId = await resolveVideoId();
        let metadata;
        let metadataPayload;
        for (let attempt = 0; attempt < 60; attempt += 1) {
          metadata = await fetch(`/video/${encodeURIComponent(resolvedVideoId)}`);
          metadataPayload = await metadata.json().catch(() => ({}));
          if (metadata.status !== 202) break;
          document.getElementById('status').innerText = `Video processing… checking again in 5 seconds (${attempt + 1}/60)`;
          await new Promise((resolve) => setTimeout(resolve, 5000));
        }
        if (!metadata?.ok) throw new Error(metadataPayload?.error || 'Video metadata unavailable');
        const video = metadataPayload.video;
        const response = await fetch(`/api/links/${encodeURIComponent(linkSlug)}/view/start`, { method: 'POST' });
        if (!response.ok) throw new Error('Traffic quality check failed');
        const tracking = await response.json();
        viewSessionId = tracking.sessionId;
        viewToken = tracking.viewToken;
        minimumWatchSeconds = Number(tracking.minimumWatchSeconds) || 5;
        const directUrl = video.hlsUrl;
        const fallbackUrl = video.streamUrl || `/video/${encodeURIComponent(resolvedVideoId)}/stream`;
        if (/\.mp4(?:$|\?)/i.test(directUrl)) {
          browserPlayer.src = directUrl;
        } else if (browserPlayer.canPlayType('application/vnd.apple.mpegurl')) {
          browserPlayer.src = directUrl;
        } else if (window.Hls && window.Hls.isSupported()) {
          const hls = new window.Hls({ enableWorker: true });
          hls.loadSource(directUrl);
          hls.attachMedia(browserPlayer);
          hls.on(window.Hls.Events.ERROR, (_event, data) => {
            if (!data?.fatal || browserPlayer.dataset.fallbackAttempted === 'true') return;
            browserPlayer.dataset.fallbackAttempted = 'true';
            hls.destroy();
            window.nightboxHls = null;
            browserPlayer.src = fallbackUrl;
            browserPlayer.load();
          });
          window.nightboxHls = hls;
        } else {
          throw new Error('HLS playback is not supported by this browser');
        }
        browserPlayer.style.display = 'block';
        browserPlayer.load();
        browserPlayer.addEventListener('error', () => {
          if (browserPlayer.dataset.fallbackAttempted === 'true') return;
          browserPlayer.dataset.fallbackAttempted = 'true';
          browserPlayer.src = fallbackUrl;
          browserPlayer.load();
        }, { once: true });
        document.getElementById('status').innerText = 'Watch here or open the NightBox app.';
      } catch (error) {
        document.getElementById('status').innerText = 'This video is not available in the browser.';
      }
    }

    async function qualifyBrowserView() {
      if (qualified || qualificationInFlight || !viewSessionId || !viewToken) return;
      qualificationInFlight = true;
      try {
        const response = await fetch(`/api/views/${encodeURIComponent(viewSessionId)}/qualify`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ viewToken }), keepalive: true
        });
        if (response.ok) {
          await response.json().catch(() => ({}));
          qualified = true;
        }
      } catch (_) {
        // A transient network failure should be retried on the next timeupdate.
      } finally {
        qualificationInFlight = false;
      }
    }

    browserPlayer.addEventListener('timeupdate', () => {
      if (browserPlayer.currentTime >= minimumWatchSeconds) void qualifyBrowserView();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && browserPlayer.currentTime >= minimumWatchSeconds) void qualifyBrowserView();
    });

    let fallbackTimer = null;
    let appLaunchAttempted = false;

    async function attemptOpen() {
      if (!/android/i.test(navigator.userAgent)) {
        document.getElementById('status').innerText = 'Watch in your browser or install the NightBox app.';
        document.getElementById('loader').style.display = 'none';
        return;
      }
      if (!linkSlug && !videoId) {
        document.getElementById('status').innerText = 'This NightBox link is not available.';
        document.getElementById('loader').style.display = 'none';
        return;
      }
      appLaunchAttempted = true;
      document.getElementById('openBtn').href = buildIntentUrl();
      // Telegram's embedded browser can block intent:// navigation. Try the
      // app-owned scheme first, then retain the verified App Link fallback.
      window.location.href = buildAppSchemeUrl();
      setTimeout(() => {
        if (document.visibilityState === 'visible') window.location.href = buildIntentUrl();
      }, 450);
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(() => {
        if (document.visibilityState === 'visible') window.location.href = PLAY_STORE_URL;
      }, 2200);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') clearTimeout(fallbackTimer);
    });

    document.getElementById('openBtn').href = /android/i.test(navigator.userAgent) ? '#' : PLAY_STORE_URL;
    document.getElementById('openBtn').addEventListener('click', (e) => {
      e.preventDefault();
      attemptOpen();
    });

    // Auto-attempt on load
    window.onload = () => {
      startBrowserView();
      if (/android/i.test(navigator.userAgent)) setTimeout(attemptOpen, 500);
      
      // Update status if it stays on page
      setTimeout(() => {
        if (appLaunchAttempted && document.visibilityState === 'visible') {
          document.getElementById('status').innerText = "If the app didn't open, tap below to retry or install it.";
        }
        document.getElementById('loader').style.display = 'none';
      }, 4000);
    };
  </script>
</body>
</html>
