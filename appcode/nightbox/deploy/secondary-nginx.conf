# NightBox secondary edge origin.
# This file is intentionally standalone: it does not include or reuse any
# other project's Nginx sites, roots, logs, or upstreams.

server {
    listen 80;
    server_name api.nightbox.in;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name nightbox.in www.nightbox.in app.nightbox.in admin.nightbox.in;

    return 301 https://$host$request_uri;

    root /var/www/nightbox-secondary/web;
    index index.html;
    client_max_body_size 2G;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Dynamic/share/API paths remain owned by the primary backend.
    location ~ ^/(api|video|watch|l)(/|$) {
        proxy_pass https://67.211.219.103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        alias /var/www/nightbox-secondary/web/.well-known/assetlinks.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.nightbox.in;

    ssl_certificate /etc/letsencrypt/live/api.nightbox.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nightbox.in/privkey.pem;
    client_max_body_size 2G;

    location / {
        proxy_pass https://67.211.219.103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl http2;
    server_name app.nightbox.in admin.nightbox.in;

    ssl_certificate /etc/letsencrypt/live/api.nightbox.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nightbox.in/privkey.pem;
    root /var/www/nightbox-secondary/web;
    index index.html;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Missing assets must not fall back to index.html: browsers reject that
    # HTML response as a JavaScript module and the SPA becomes a blank page.
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /ads.txt {
        proxy_pass https://67.211.219.103;
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }
    location = /app-ads.txt {
        proxy_pass https://67.211.219.103;
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Enabled after the root-domain certificate is issued. The other subdomains
# remain on their existing primary origin until their DNS caches expire and
# their certificates are issued in the same controlled way.
