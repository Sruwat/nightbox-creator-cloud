# NightBox secondary edge origin.
# This file is intentionally standalone: it does not include or reuse any
# other project's Nginx sites, roots, logs, or upstreams.

server {
    listen 80;
    server_name api.nightbox.in;

    client_max_body_size 4G;
    location / {
        proxy_pass https://67.211.219.103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name nightbox.in www.nightbox.in app.nightbox.in admin.nightbox.in;

    root /var/www/nightbox-secondary/web;
    index index.html;
    client_max_body_size 4G;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Dynamic/share/API paths remain owned by the primary backend.
    location ~ ^/(api|video|watch|l)(/|$) {
        proxy_pass https://67.211.219.103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /.well-known/assetlinks.json {
        proxy_pass https://67.211.219.103;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
