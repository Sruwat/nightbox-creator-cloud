server {
    listen 80;
    server_name api.nightbox.in;

    # Isolated NightBox media origin. This path is never shared with NightHeast.
    location /nightbox/ {
        alias /var/lib/nightbox-p4/media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public share links use the main NightBox domain while the watch handler
# remains owned by the isolated backend service.
server {
    listen 80;
    server_name nightbox.in www.nightbox.in;

    location /watch/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/nightbox/nightbox-p4/web;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name app.nightbox.in admin.nightbox.in;
    root /var/www/nightbox/nightbox-p4/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
