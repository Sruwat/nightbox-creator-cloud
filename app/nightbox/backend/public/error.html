<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Not Found - Shayari By GenZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #111111;
            --text-primary: #FFFFFF;
            --text-secondary: #AAAAAA;
            --accent-color: #7C4DFF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            padding: 40px;
            background: var(--surface-color);
            border-radius: 32px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(124, 77, 255, 0.2);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn {
            background: var(--accent-color);
            color: white;
            padding: 14px 28px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s;
            display: inline-block;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>Video Not Found</h1>
        <p>The video you're looking for doesn't exist or has been removed. Check the link and try again.</p>
        <a href="https://play.google.com/store/apps/details?id=simple.shayaribygenz" class="btn">Get the App</a>
    </div>
</body>
</html>
