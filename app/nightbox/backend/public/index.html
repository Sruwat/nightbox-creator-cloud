<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightbox - Video Streaming</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #111111;
      --text-primary: #FFFFFF;
      --text-secondary: #AAAAAA;
      --accent-color: #7C4DFF;
      --accent-hover: #651FFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .logo-icon {
      width: 80px; height: 80px;
      border-radius: 20px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(124, 77, 255, 0.3);
    }
    
    .logo-icon img { width: 100%; height: 100%; object-fit: cover; }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    p {
      color: var(--text-secondary);
      font-size: 18px;
      margin-bottom: 32px;
      max-width: 400px;
      line-height: 1.5;
    }

    .btn {
      background: var(--accent-color);
      color: white;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 77, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="logo-icon">
    <img src="/logo.png" alt="Logo">
  </div>
  <h1>Nightbox</h1>
  <p>Download the app to watch videos</p>
  <a href="https://play.google.com/store/apps/details?id=simple.shayaribygenz" class="btn">Download Nightbox App</a>
</body>
</html>
